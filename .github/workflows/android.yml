name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  schedule:
    - cron: '0 4 * * *'   # daily 04:00 UTC — refresh APK with latest JRE artifacts
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # Needed by softprops/action-gh-release to create/update the rolling tag.
    permissions:
      contents: write
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # JRE 8 deliberately omitted — RuneLite needs Java 11+ (compiled with major 55).
      # The JRE 8 binpack from Pojav is ~13 MB of dead weight for our APK.

      - name: Get JRE17
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre17-pojav
      #
      # - name: Get JRE21
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-21
      #     workflow_conclusion: completed
      #     repo: AngelAuraMC/angelauramc-openjdk-build
      #     branch: buildjre17-21
      #     name: jre21-pojav
      #
      # - name: Get JRE25
      #   uses: dawidd6/action-download-artifact@v9
      #   with:
      #     workflow: build.yml
      #     path: app_pojavlauncher/src/main/assets/components/jre-25
      #     workflow_conclusion: completed
      #     repo: FCL-Team/Android-OpenJDK-Build
      #     branch: Build_JRE_25
      #     name: jre25-multiarch

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "8.11"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build Debug .apk
        run: |
          # Build the launcher (debug only — no release keystore in fork)
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen md5sums
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.*

      # Rolling "latest" release that always points at the most recent main-branch
      # build. The tag is deleted + recreated each push so the URL stays stable
      # (https://github.com/sturq/runelitedroid/releases/latest). Skipped on PRs.
      - name: Publish rolling release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "RuneLiteDroid (latest build)"
          body: |
            Automatic build from commit ${{ github.sha }} on ${{ github.ref_name }}.

            See [the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for build details.
          files: out/app-debug.*
          prerelease: true
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
