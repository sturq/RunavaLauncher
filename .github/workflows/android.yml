name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  schedule:
    - cron: '0 4 * * *'   # daily 04:00 UTC - refresh APK with latest JRE artifacts
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # Needed by softprops/action-gh-release to create/update the rolling tag.
    permissions:
      contents: write
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # JRE 8 deliberately omitted - RuneLite needs Java 11+ (compiled with major 55).
      # The JRE 8 binpack from Pojav is ~13 MB of dead weight for our APK.
      #
      # Using JRE 21 instead of 17: AngelAuraMC's OpenJDK 17 build for Android has
      # a deterministic libjvm.so+0xa14ca0 SIGSEGV in Cacio's AWT peer path that
      # we couldn't work around at the agent or activity level - see the comment
      # in RuneLiteLauncherActivity for the disassembly notes.

      # Trying FCL-Team's OpenJDK 25 build. AngelAuraMC's OpenJDK 21 has a
      # use-after-free in its JNI handle-list grow function (libjvm.so+0xac44cc,
      # we verified by disassembly) that fires under any AWT-driven JNI burst.
      # FCL-Team is a completely different OpenJDK port for Android - at the
      # same offset its libjvm has unrelated code (cbz, harmless), so at minimum
      # the specific bug we keep hitting is structurally not present.
      # We used to pull the jre25-multiarch CI artifact from
      # FCL-Team/Android-OpenJDK-Build's build.yml. GitHub deletes Actions
      # artifacts after ~90 days and that branch is rebuilt only occasionally,
      # so the artifact aged out and every run (the daily schedule especially)
      # started dying with "no downloadable artifacts found (expired)".
      # The identical JRE 25 binpack is committed permanently into the
      # FoldCraftLauncher repo's assets, so fetch it straight from raw git -
      # those blobs never expire. We only need arm64 (APP_ABI is arm64-v8a),
      # so we grab just universal + bin-arm64 + version and skip the others.
      # Pinned to c6f551e: the commit after it (1847aa9, 2026-08-05) dropped the
      # committed JRE assets in favour of generating them per architecture, which
      # 404'd every build from that day on. The binpack is a frozen artifact, so
      # a pinned commit is the right thing to point at anyway.
      - name: Get JRE25
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/FCL-Team/FoldCraftLauncher/c6f551e2094c74203e2a5e107d527f668b4bcae3/FCL/src/main/assets/app_runtime/java/jre25"
          dest="app_pojavlauncher/src/main/assets/components/jre-25"
          mkdir -p "$dest"
          for f in version universal.tar.xz bin-arm64.tar.xz; do
            curl -fsSL "$base/$f" -o "$dest/$f"
          done
          xz -t "$dest/universal.tar.xz" "$dest/bin-arm64.tar.xz"
          ls -la "$dest"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "8.11"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build Debug .apk
        run: |
          # Build the launcher (debug only - no release keystore in fork)
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen md5sums
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5

      # Branch builds get an artifact instead, so a change can be installed and
      # tested without publishing anything.
      - name: Upload branch .apk
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.ref_name }}
          path: out/app-debug.apk

      # Rolling "latest" release that always points at the most recent main-branch
      # build. The tag is deleted + recreated each push so the URL stays stable
      # (https://github.com/sturq/runelitedroid/releases/latest). Skipped on PRs.
      - name: Publish rolling release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "RuneLiteDroid (latest build)"
          body: |
            Automatic build from commit ${{ github.sha }} on ${{ github.ref_name }}.

            See [the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for build details.
          files: out/app-debug.*
          prerelease: true
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
